<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <nav>
            <div class="upper-nav">
                <div class="search-section">
                    <img id="search-icon">
                    <input type="search" id="search-bar" name="search-bar">
                </div>
                <div class="user-section">
                    <img id="notification-icon">
                    <img id="mini-user-icon">
                    <p class="medium-wording">Morgan Oakley</p>
                </div>
            </div>
            <div class="lower-nav">
                <div class="welcome-section">
                    <img class="user-icon">
                    <div>
                        <p class="small-wording">Hi there,</p>
                        <p class="large-wording">Morgan Oakley(@morgan)</p>
                    </div>
                </div>
                <div class="action-section">
                    <button>New</button>
                    <button>Upload</button>
                    <button>Share</button>
                </div>
            </div>
        </nav>
        <aside>
            <h1>Dashboard</h1>
            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Messages</li>
                <li>History</li>
                <li>Tasks</li>
                <li>Communities</li>
            </ul>
            <ul>
                <li>Settings</li>
                <li>Support</li>
                <li>Privacy</li>
            </ul>
        </aside>
        <main>
            <div class="projects">
                <h2>Your Projects</h2>
                <div class="card-canva">

                </div>
            </div>
            <div class="announcements">
                <h2>Announcements</h2>
                <div class="announcement-info">

                </div>
            </div>
            <div class="trending">
                <h2>Trending</h2>
                <div class="trending-info">

                </div>
            </div>
        </main>
    </div>
</body>
</html>
